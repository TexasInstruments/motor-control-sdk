ALIASES+=VAR_LP_BOARD_NAME="LP-AM263P"
ALIASES+=VAR_LP_BOARD_NAME_LOWER="am263px-lp"
ALIASES+=VAR_SOC_DEFAULT_PACKAGE="ZCZ_S"
ALIASES+=VAR_SOC_MIGRATE_TO_PACKAGE="ZCZ_F"
ALIASES+=VAR_SOC_MANIFEST="mcu_plus_sdk_am263px_manifest.html"
ALIASES+=VAR_MCU_SDK_DOCS_PATH="../../mcu_plus_sdk/docs/api_guide_am263px"
