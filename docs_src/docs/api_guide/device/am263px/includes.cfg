ENABLED_SECTIONS = SOC_AM263PX

# SOC specific aliases
ALIASES+=VAR_SOC_NAME="AM263PX"
ALIASES+=VAR_SOC_NAME_LOWER="am263px"
ALIASES+=VAR_BOARD_NAME="AM263PX-CC"
